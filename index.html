<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chinese City — 3D Prototype</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050607; color: #fff; font-family: Arial, sans-serif; }
    #viewer { position: fixed; inset: 0; width: 100%; height: 100%; }
    .hud { position: fixed; z-index: 10; left: 28px; top: 26px; pointer-events: none; }
    .eyebrow { margin: 0 0 8px; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; opacity: .62; }
    h1 { margin: 0; font-size: clamp(25px, 4vw, 56px); font-weight: 500; letter-spacing: -.04em; }
    .hint { position: fixed; z-index: 10; right: 24px; bottom: 22px; font-size: 12px; opacity: .55; pointer-events: none; }
    #status { position: fixed; z-index: 20; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 12px 16px; border: 1px solid rgba(255,255,255,.15); border-radius: 999px; background: rgba(0,0,0,.55); backdrop-filter: blur(12px); font-size: 13px; }
    #status.error { color: #ffb4b4; max-width: 520px; border-radius: 16px; line-height: 1.45; }
  </style>
</head>
<body>
  <div id="viewer"></div>
  <div class="hud">
    <p class="eyebrow">Interactive environment / Prototype 02</p>
    <h1>Chinese City</h1>
  </div>
  <div class="hint">Drag to look · Wheel to move</div>
  <div id="status">Loading 3D scenery…</div>

  <script type="module">
    const status = document.querySelector('#status');
    const viewer = document.querySelector('#viewer');
    const sceneURL = './Chinise City 2nd Project/3D Chinise Scenery .spz';

    try {
      const { Viewer } = await import('https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/+esm');

      const splatViewer = new Viewer({
        rootElement: viewer,
        cameraUp: [0, -1, 0],
        initialCameraPosition: [0, 0, 5],
        initialCameraLookAt: [0, 0, 0],
        sharedMemoryForWorkers: false,
        dynamicScene: false
      });

      await splatViewer.addSplatScene(sceneURL, {
        showLoadingUI: false,
        progressiveLoad: true
      });

      splatViewer.start();
      status.remove();
    } catch (error) {
      console.error(error);
      status.classList.add('error');
      status.textContent = 'The scenery viewer could not load. Open this page through a local web server rather than double-clicking index.html. Error: ' + (error?.message || error);
    }
  </script>
</body>
</html>
